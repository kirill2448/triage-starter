<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    .notice { margin: 1rem 0; padding: .75rem 1rem; border-radius: .4rem; }
    .notice.ok { background: #e8f5e9; }
    .notice.warn { background: #fff4e5; }
    .notice.error { background: #fdecea; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <div id="status" class="notice" role="status" aria-live="polite" hidden></div>

  <section id="ready" hidden>
    <p><strong>Тема:</strong> <span id="topic"></span></p>
    <label for="draft">Черновик ответа (проверьте и отредактируйте перед отправкой)</label>
    <textarea id="draft" rows="5"></textarea>
  </section>

  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цена и стоимость", other: "Другое" };
    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const message = document.querySelector("#message");
    const statusBox = document.querySelector("#status");
    const readyBox = document.querySelector("#ready");
    const topicEl = document.querySelector("#topic");
    const draftEl = document.querySelector("#draft");
    let requestId = 0;

    function clearResult() {
      readyBox.hidden = true;
      topicEl.textContent = "";
      draftEl.value = "";
    }

    function showStatus(kind, text) {
      statusBox.className = `notice ${kind}`;
      statusBox.textContent = text;
      statusBox.hidden = false;
    }

    const MANUAL_TEXT = "AI не смог надёжно разобрать заявку. Разберите её вручную: определите тему и напишите ответ клиенту сами.";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = ++requestId;
      clearResult(); // старый черновик не должен оставаться на экране
      const text = message.value;
      if (text.trim() === "") {
        showStatus("error", "Введите текст заявки.");
        return;
      }
      button.disabled = true;
      showStatus("ok", "Разбираем заявку…");
      let data = null;
      let httpStatus = 0;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        httpStatus = reply.status;
        data = await reply.json().catch(() => null);
      } catch {
        data = null;
      } finally {
        if (id === requestId) button.disabled = false;
      }
      if (id !== requestId) return; // пришёл ответ на устаревший запрос

      if (data?.status === "ready" && TOPIC_LABELS[data.topic] && typeof data.draft === "string" && data.draft.trim()) {
        topicEl.textContent = TOPIC_LABELS[data.topic];
        draftEl.value = data.draft;
        readyBox.hidden = false;
        showStatus("ok", "Готово. Проверьте тему и черновик перед отправкой клиенту.");
      } else if (httpStatus === 400 || data?.status === "invalid_input") {
        showStatus("error", "Текст заявки пустой или некорректный. Проверьте ввод.");
      } else {
        showStatus("warn", MANUAL_TEXT);
      }
    });
  </script>
</body>
</html>
